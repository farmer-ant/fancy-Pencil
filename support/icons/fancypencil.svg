<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34404f"/>
      <stop offset="1" stop-color="#1a2029"/>
    </linearGradient>
    <linearGradient id="ferrule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset="0.45" stop-color="#b9c0c8"/>
      <stop offset="1" stop-color="#7d8792"/>
    </linearGradient>
    <linearGradient id="eraser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb3be"/>
      <stop offset="1" stop-color="#e06a7e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="1" stop-color="#ffc533"/>
    </linearGradient>
    <clipPath id="tile"><rect x="12" y="12" width="232" height="232" rx="48"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="12" y="12" width="232" height="232" rx="48" fill="url(#bg)"/>
  <g clip-path="url(#tile)" stroke="#3b8ee8" stroke-opacity="0.13" stroke-width="1.5">
    <path d="M44 12V244M76 12V244M108 12V244M140 12V244M172 12V244M204 12V244M236 12V244
             M12 44H244M12 76H244M12 108H244M12 140H244M12 172H244M12 204H244M12 236H244"/>
  </g>
  <rect x="13" y="13" width="230" height="230" rx="47" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- the drawn line: a filleted corner, CAD style, with grips -->
  <path d="M106 196 H76 A28 28 0 0 1 48 168 V58" fill="none" stroke="#5aa8ff" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#3b8ee8" stroke="#ffffff" stroke-width="2.5">
    <rect x="40" y="50" width="16" height="16"/>
    <rect x="40" y="105" width="16" height="16"/>
  </g>

  <!-- sparkles -->
  <path d="M192 150 Q195 167 212 170 Q195 173 192 190 Q189 173 172 170 Q189 167 192 150Z" fill="url(#gold)"/>
  <path d="M222 192 Q223.6 201 232 202.5 Q223.6 204 222 213 Q220.4 204 212 202.5 Q220.4 201 222 192Z" fill="url(#gold)"/>

  <!-- pencil: modelled pointing along +x with the tip at the origin, then turned -45 degrees -->
  <g transform="translate(106 196) rotate(-45) scale(0.8)" filter="url(#shadow)">
    <polygon points="0,0 46,-19 46,19" fill="#efcb98"/>
    <polygon points="0,0 46,-19 46,-6" fill="#f8dcb0"/>
    <polygon points="0,0 15,-6.2 15,6.2" fill="#2b2f36"/>
    <path d="M46 -19 H162 V-6.5 H46 Q38 -12.75 46 -19Z" fill="#ffd84a"/>
    <path d="M46 -6.5 H162 V6.5 H46 Q38 0 46 -6.5Z" fill="#f7b500"/>
    <path d="M46 6.5 H162 V19 H46 Q38 12.75 46 6.5Z" fill="#d68f00"/>
    <path d="M50 -14 H160" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="162" y="-20" width="28" height="40" rx="2" fill="url(#ferrule)"/>
    <path d="M169 -20V20M176 -20V20M183 -20V20" stroke="#6b7480" stroke-width="2"/>
    <path d="M190 -19 H204 A14 19 0 0 1 204 19 H190Z" fill="url(#eraser)"/>
  </g>
</svg>
